<!doctype html>
<title>My Claude Panel</title>
<style>
  body{display:flex;height:100vh;margin:0;font:14px system-ui}
  iframe{flex:1;border:0}
  #panel{width:230px;display:flex;flex-direction:column;gap:10px;padding:10px}
  fieldset{border:1px solid #ccc;border-radius:8px;display:flex;flex-direction:column;gap:6px}
  textarea{resize:vertical;min-height:70px;font:inherit}
  input[type=number]{width:56px}
  #sendBtn{padding:12px;font-size:16px;font-weight:600}
  #sumBtn{margin-top:auto}
  #prompts{flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:8px}
  .pwrap{display:flex;flex-direction:column;gap:2px}
  .prow{display:flex;gap:2px}
  .snippet{font-size:11px;color:#888;max-width:180px}
  #prompts button.active{background:#2b44c4;border-color:#2b44c4;color:#fff}
  .del{padding:0 5px;line-height:1;color:#c0392b}
  #newForm{flex-basis:100%;display:flex;flex-direction:column;gap:4px}
  #newForm textarea{min-height:48px}
  fieldset.danger{border-color:#c0392b} fieldset.danger legend{color:#c0392b}
  fieldset.ok{border-color:#1e7a40} fieldset.ok legend{color:#1e7a40}
  #hist{display:flex;flex-direction:column;gap:4px;font-size:12px}
  #hist button{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body, button, label, input, textarea { touch-action: manipulation }
</style>

<iframe id="term"></iframe>
<script>
  // ask serve.py which ttyd this panel is paired with (claude-s passes it via env)
  fetch('/config').then(r => r.json())
    .then(c => { term.src = `http://127.0.0.1:${c.ttyd_port}` })
    .catch(() => { term.src = 'http://127.0.0.1:7681' })
</script>

<div id="panel">
  <!-- the MESSAGE -->
  <textarea id="msg" placeholder="Type to Claude… (Enter sends, Shift+Enter = newline)"></textarea>

  <!-- CONSTRAINTS — each appends one clause; blank / unticked appends nothing -->
  <fieldset>
    <legend>length</legend>
    <label><input type="radio" name="unit" value="auto" checked> auto (Claude picks)</label>
    <label>at most <input type="number" id="n" min="1"></label>
    <label><input type="radio" name="unit" value="sentences"> sentences</label>
    <label><input type="radio" name="unit" value="words"> words</label>
  </fieldset>
  <fieldset>
    <legend>format</legend>
    <label><input type="checkbox" id="chart" checked> ASCII chart/table ok</label>
  </fieldset>
  <fieldset id="edits">
    <legend>edits</legend>
    <label>≤ <input type="number" id="lines" min="0"> lines per step (0 = no edits)</label>
  </fieldset>

  <!-- canned messages — these skip the composer on purpose.
       buttons are built by JS; "+" opens the form that adds your own -->
  <fieldset id="prompts"><legend>prompts</legend>
    <button id="newBtn" title="new prompt" onclick="toggleNew()">+</button>
    <div id="newForm" hidden>
      <input id="pLabel" type="text" placeholder="button label" maxlength="24">
      <textarea id="pText" placeholder="prompt text… (Enter adds, Esc cancels)"></textarea>
      <button onclick="addMine()">add</button>
    </div>
  </fieldset>

  <button id="sendBtn" onclick="sendComposed()">Send</button>
  <button onclick="toggleHist()">history</button>
  <div id="hist" hidden></div>
  <button id="sumBtn" onclick="sendComposed('Summarize this session.')">summarize</button>
</div>

<script>
  const $ = id => document.getElementById(id)
  const send = text => fetch("/send", {method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify({text})})

  // message + active constraint clauses → the composed prompt
  function compose(msg) {
    const base = [msg, ...PROMPTS.filter(pr => pr.armed).map(pr => pr.text)]
      .filter(Boolean).join("\n\n")
    const clauses = []
    const unit = document.querySelector('[name=unit]:checked').value
    if (unit !== "auto" && $("n").value) clauses.push(`Reply in at most ${$("n").value} ${unit}.`)
    if ($("chart").checked) clauses.push("Use an ASCII chart or table where it helps.")
    const lines = $("lines").value            // "" = no clause; 0 or less = read-only
    if (lines !== "") clauses.push(+lines <= 0
      ? "Do not edit any files — answer and explain only."
      : `When editing files, change at most ${lines} lines at a time, then pause so I can review.`)
    return clauses.length ? base + "\n\n" + clauses.join("\n") : base
  }
  // no argument → sends the input bar (and clears it on success);
  // with a canned string → sends that instead, leaving your draft alone
  function sendComposed(text) {
    const msg = (text ?? $("msg").value).trim()
    if (msg || PROMPTS.some(pr => pr.armed)) send(compose(msg)).then(r => {
      if (r.ok && text == null && msg) { saveHist(msg, "sent"); $("msg").value = "" } })
  }
  $("msg").addEventListener("keydown", e => {
    const m = $("msg")
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendComposed() }
    // ↑/↓ recall history only once the caret has HIT the boundary (start/end
    // of the text) — or while already browsing; otherwise arrows move natively
    else if (e.key === "ArrowUp" && (m.selectionStart === 0 || histIdx !== -1)
             && histIdx + 1 < hist.length) {
      e.preventDefault()
      if (histIdx === -1) liveDraft = m.value       // stash what you were typing
      m.value = hist[++histIdx].text
    } else if (e.key === "ArrowDown" && (m.selectionEnd === m.value.length || histIdx !== -1)
               && histIdx >= 0) {
      e.preventDefault()
      m.value = --histIdx === -1 ? liveDraft : hist[histIdx].text
    } })
  $("msg").addEventListener("input", () => histIdx = -1)  // editing = it's yours now
  // ⌘K → jump to the input bar (page-side only; the iframe never forwards keys)
  document.addEventListener("keydown", e => {
    if (e.metaKey && e.key === "k") { e.preventDefault(); $("msg").focus() } })
  // Enter sends from anywhere on the page — except the input bar (own handler
  // above), the new-prompt form (own handler below) and buttons (Enter there
  // means "click me" natively)
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.metaKey &&
        e.target.id !== "msg" && e.target.tagName !== "BUTTON" &&
        !e.target.closest("#newForm")) {
      e.preventDefault(); sendComposed() } })
  // ⌘A outside a text box = select the input bar's text (kills the page-wide
  // select-all that highlights every widget when focus drifted to a radio etc.)
  document.addEventListener("keydown", e => {
    if (!(e.metaKey && e.key === "a")) return
    if (e.target.closest("input[type=number], input[type=text], #newForm textarea")) return
    e.preventDefault(); $("msg").focus(); $("msg").select() })
  // ── pre-built prompts — add yours here as {label, text} ────────────────
  const PROMPTS = [
    {label: "pro", text: "What's the pro and professional way to do this?"},
  ]
  // …plus the ones you type into the "+" form. sessionStorage = they last as
  // long as this browser tab does: a reload keeps them, a new tab starts clean.
  for (const pr of JSON.parse(sessionStorage.getItem("sb-prompts") || "[]"))
    PROMPTS.push({...pr, mine: true})           // mine = yours, so deletable + saved
  const saveMine = () => sessionStorage.setItem("sb-prompts", JSON.stringify(
    PROMPTS.filter(p => p.mine).map(({label, text}) => ({label, text}))))  // drop `armed`

  function renderPrompt(pr) {
    const b = document.createElement("button")
    b.textContent = pr.label
    const tip = document.createElement("div")   // snippet preview under the button
    tip.className = "snippet"; tip.textContent = pr.text; tip.hidden = true
    b.onclick = () => {                         // toggle armed — appended at SEND time
      pr.armed = !pr.armed
      b.classList.toggle("active", pr.armed); tip.hidden = !pr.armed
    }
    const row = document.createElement("div"); row.className = "prow"; row.append(b)
    if (pr.mine) {                              // only your own get a delete ×
      const x = document.createElement("button")
      x.className = "del"; x.textContent = "×"; x.title = "remove"
      x.onclick = () => {
        PROMPTS.splice(PROMPTS.indexOf(pr), 1); wrap.remove(); saveMine()
      }
      row.append(x)
    }
    const wrap = document.createElement("div"); wrap.className = "pwrap"
    wrap.append(row, tip)
    $("newBtn").before(wrap)                    // keep "+" last in the row
  }
  PROMPTS.forEach(renderPrompt)

  // ── the "+" form: type a label + text → a new toggleable prompt button ──
  function toggleNew() {
    const f = $("newForm"); f.hidden = !f.hidden
    $("newBtn").textContent = f.hidden ? "+" : "−"
    if (!f.hidden) $("pLabel").focus()
  }
  function addMine() {
    const label = $("pLabel").value.trim(), text = $("pText").value.trim()
    if (!label || !text) { $(label ? "pText" : "pLabel").focus(); return }
    const pr = {label, text, mine: true}
    PROMPTS.push(pr); renderPrompt(pr); saveMine()
    $("pLabel").value = $("pText").value = ""
    toggleNew()                                 // added → collapse, back to "+"
  }
  // this form lives inside the page, so it must win the page-wide Enter/⌘A keys
  $("newForm").addEventListener("keydown", e => {
    if (e.key === "Escape") { toggleNew() }
    else if (e.key === "Enter" && !e.shiftKey && e.target.tagName !== "BUTTON") {
      e.preventDefault()
      e.target.id === "pLabel" ? $("pText").focus() : addMine()
    } })

  // ── history: last 5 input-bar texts (sent ✓ or abandoned drafts ✎),
  //    kept in localStorage so they survive page reloads ─────────────────
  let hist = JSON.parse(localStorage.getItem("sb-hist") || "[]")
  let histIdx = -1, liveDraft = ""      // -1 = you're on your own live text
  function saveHist(text, kind) {
    text = text.trim()
    if (!text) return
    // same text anywhere in history: drop it, re-insert at top — never duplicated
    hist = [{text, kind}, ...hist.filter(h => h.text !== text)].slice(0, 5)
    localStorage.setItem("sb-hist", JSON.stringify(hist)); renderHist()
  }
  function renderHist() {
    const box = $("hist"); box.innerHTML = ""
    if (!hist.length) { box.textContent = "no history yet"; return }
    for (const h of hist) {
      const b = document.createElement("button")
      b.textContent = (h.kind === "sent" ? "✓ " : "✎ ") + h.text
      b.title = h.text
      b.onclick = () => { $("msg").value = h.text; $("msg").focus() }
      box.appendChild(b)
    }
  }
  function toggleHist() { $("hist").hidden = !$("hist").hidden; renderHist() }
  $("msg").addEventListener("blur", () => saveHist($("msg").value, "draft"))
  // edits frame shows its mode: red = 0/no-edits, green = capped, gray = off
  function syncEditsColor() {
    const v = $("lines").value
    $("edits").className = v === "" ? "" : (+v <= 0 ? "danger" : "ok")
  }
  $("lines").addEventListener("input", syncEditsColor); syncEditsColor()
  // picking a length unit pops that unit's default into the number box
  const UNIT_DEFAULTS = {sentences: 2, words: 100}
  document.querySelectorAll("[name=unit]").forEach(r =>
    r.addEventListener("change", () => {
      if (r.value in UNIT_DEFAULTS) {
        $("n").value = UNIT_DEFAULTS[r.value]
        $("n").focus(); $("n").select()          // type to overwrite immediately
      } }))
</script>
